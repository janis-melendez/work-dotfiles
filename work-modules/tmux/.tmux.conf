# Configuration Docs:
#   - https://tmux.info/docs/configuration

# ============================================
# ESSENTIAL SETTINGS
# ============================================

# Fix Vim ESC delay (tmux 3.5+ already defaults to 10ms)
set -sg escape-time 5

# Set the base index for windows to 1 instead of 0
set -g base-index 1

# Set the base index for panes to 1 instead of 0
set -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows off

# Increase scrollback buffer
set -g history-limit 50000

# Time messages are displayed (in milliseconds)
set -g display-time 1500

# Status bar refresh rate (in seconds)
set -g status-interval 5

# Enable mouse support
set -g mouse on

# Enable focus events for vim autoread
set -g focus-events on

# Set terminal with proper colors
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Aggressive resize for multi-client
setw -g aggressive-resize on

# ============================================
# KEY BINDINGS
# ============================================

# Reload config
bind R source-file ~/.tmux.conf \; display "Config reloaded!"

# Vim-style pane navigation
setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Vim-style pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Easier and faster switching between next/prev window
bind C-p previous-window
bind C-n next-window

# Match Herdr's prefix+Shift+n: prompt for and attach to a new tmux session
bind-key N command-prompt -p "New session:" "new-session -s '%%'"

# Toggle synchronized input across panes in the current window
bind S setw synchronize-panes \; \
    display-message "Pane synchronization: #{?pane_synchronized,on,off}"

# tmux-sessionizer
# Prefix + f opens the project picker.
# Alt bindings run TS_SESSION_COMMANDS by index in the active project session.
bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"
bind-key -r M-1 run-shell "tmux neww tmux-sessionizer -s 0"
bind-key -r M-2 run-shell "tmux neww tmux-sessionizer -s 1"
bind-key -r M-3 run-shell "tmux neww tmux-sessionizer -s 2"
bind-key -r M-4 run-shell "tmux neww tmux-sessionizer -s 3"

# ============================================
# APPEARANCE
# ============================================

# Status bar position
set -g status-position top
set -g status-style "bg=#282a36,fg=#f8f8f2"
set -g status-left-length 80
set -g status-right-length 40
set -g status-left "#[bg=#8be9fd,fg=#282a36,bold] #S #[bg=#44475a,fg=#f8f8f2,nobold] #{b:pane_current_path} "
set -g status-right "#[bg=#44475a,fg=#f8f8f2] %a %b %d %I:%M %p "

# ============================================
# COPY MODE
# ============================================

# Use vi keys
setw -g mode-keys vi

# Enter copy mode
bind [ copy-mode

# Vim-style copy-mode selection
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X rectangle-toggle

# # Previous macOS/X11-only clipboard binding, kept for reference
# if-shell "uname | grep -q Darwin" \
#   'bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"' \
#   'bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"'

# Copy to the macOS, Wayland, or X11 clipboard
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel \
    'if [ "$(uname)" = Darwin ]; then
         pbcopy
     elif [ -n "$WAYLAND_DISPLAY" ] && command -v wl-copy >/dev/null 2>&1; then
         wl-copy
     else
         xclip -selection clipboard
     fi'

# Paste most recent tmux buffer
bind ] paste-buffer

# Choose and paste from saved tmux buffers
bind Space choose-buffer

# ============================================
# PLUGINS (via TPM)
# ============================================

# Install TPM first:
# git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm

# Press leader+I to install plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Optional TPM plugins are loaded only when TPM is installed. Add `set -g
# @plugin ...` declarations above this line; `work-install --plugins` will then
# install TPM and the declared plugins.
if-shell '[ -f "$HOME/.tmux/plugins/tpm/tpm" ]' 'run-shell "$HOME/.tmux/plugins/tpm/tpm"'
